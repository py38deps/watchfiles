name: ci

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: test ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11-v7.3.23"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-mock pytest-timeout pytest-pretty dirty-equals

      - name: build and install
        run: python -m pip install -e .

      - name: run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install lint dependencies
        run: |
          python -m pip install "mypy==1.14.1" "ruff==0.15.15" "trio>=0.28.0" anyio

      - name: ruff
        run: |
          ruff check watchfiles tests
          ruff format --check watchfiles tests

      - name: mypy
        run: mypy watchfiles

  sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build sdist
        uses: PyO3/maturin-action@v1.49.3
        with:
          command: sdist
          args: --out dist

      - name: upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: watchfiles-sdist
          path: dist/*.tar.gz

  build:
    name: build ${{ matrix.target }} on ${{ matrix.os }} (${{ matrix.manylinux || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
          - os: ubuntu-latest
            target: i686
            manylinux: "2_17"
          - os: ubuntu-latest
            target: armv7
            manylinux: "2_17"
          - os: ubuntu-latest
            target: ppc64le
            manylinux: "2_17"
          - os: ubuntu-latest
            target: s390x
            manylinux: "2_17"
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            manylinux: "2_31"
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_1
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_1
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
          - os: windows-latest
            target: aarch64
          - os: windows-latest
            target: i686

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux builds run inside the manylinux/musllinux container. On macOS/Windows
      # maturin uses its bundled target sysconfigs, so only a host Python is needed.
      - name: set up python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Mirror the upstream wheel set: cp310-abi3 plus the free-threaded cp314 wheel.
      # Free-threaded interpreters ignore the abi3 feature, so both come from one build.
      - name: build cp310-abi3 and cp314t wheels
        uses: PyO3/maturin-action@v1.49.3
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --out dist
            --interpreter 3.10 3.14t
            --no-default-features --features abi3-py310

      # Extra backport wheels: the same platform tags as the cp310 wheels, but using
      # the 3.8 stable ABI. Building with 3.10 keeps the platform tag identical to the
      # cp310 wheel; the Python tag still comes from abi3-py38 (any interpreter >= 3.8
      # is enough to build it).
      - name: build cp38-abi3 wheel
        uses: PyO3/maturin-action@v1.49.3
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --out dist
            --interpreter 3.10
            --no-default-features --features abi3-py38

      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: watchfiles-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  build-pypy:
    name: build pypy3.11 on ${{ matrix.os }} (${{ matrix.manylinux || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: set up pypy
        id: pypy
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11-v7.3.23"

      - name: build pypy wheels
        uses: PyO3/maturin-action@v1.49.3
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --out dist
            --interpreter "${{ steps.pypy.outputs.python-path || 'pypy3.11' }}"
            --no-default-features

      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: watchfiles-pypy-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  list-files:
    needs: [build, build-pypy, sdist]
    runs-on: ubuntu-latest

    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: watchfiles-*
          merge-multiple: true
          path: dist

      - name: list files
        run: ls -lh dist/
